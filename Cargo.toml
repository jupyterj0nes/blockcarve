[package]
name = "blockcarve"
version = "0.1.1"
edition = "2021"
description = "Block-wise signature carving for forensic images, live volumes and memory blobs: guarded sources, an aligned scanner with carry-over, and structural validators for registry hives, EVTX chunks, NTFS records, Prefetch and systemd journals."
authors = ["Tono Diaz (@jupyterj0nes)"]
repository = "https://github.com/jupyterj0nes/blockcarve"
license = "AGPL-3.0-only"
keywords = ["forensics", "carving", "dfir", "ntfs", "evtx"]
categories = ["parser-implementations", "filesystem"]
readme = "README.md"

[dependencies]
walkdir = "2"
mft = { version = "0.7", optional = true }

[features]
default = ["mft"]
# `INDX` entry parsing returns `mft::attribute::x30::FileNameAttr`; without it only the
# `FILE` record validator is built.
mft = ["dep:mft"]
